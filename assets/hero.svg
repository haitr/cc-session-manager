<path d="M48 150 v-20 a14 14 0 0 1 14 -14 h1076 a14 14 0 0 1 14 14 v20 z" fill="#1A1630"/>
<rect x="48.5" y="116.5" width="1103" height="475" rx="14" fill="none" stroke="#2E2947"/>
<circle cx="74" cy="133" r="6" fill="#FF5F57"/><circle cx="94" cy="133" r="6" fill="#FEBC2E"/><circle cx="114" cy="133" r="6" fill="#28C840"/>
<text x="600" y="138" class="pill" fill="#77758C" text-anchor="middle">ccsm</text>
<text x="72" y="181" class="m" fill="#EE6FF8" textLength="387" font-weight="700">ccsm  128 sessions · 14 projects · 412.6 MB</text>
<text x="459" y="181" class="m" fill="#7D56F4" textLength="117">  · 3 foreign</text>
<rect x="72" y="188" width="63" height="24" fill="#7D56F4"/>
<text x="72" y="205" class="m" fill="#FAFAFA" textLength="63"> [all] </text>
<text x="135" y="205" class="m" fill="#77758C" textLength="117"> api-gateway </text>
<text x="252" y="205" class="m" fill="#77758C" textLength="54"> ccsm </text>
<text x="306" y="205" class="m" fill="#77758C" textLength="90"> compiler </text>
<text x="396" y="205" class="m" fill="#77758C" textLength="90"> dotfiles </text>
<text x="486" y="205" class="m" fill="#77758C" textLength="63"> infra </text>
<text x="549" y="205" class="m" fill="#77758C" textLength="81"> ios-app </text>
<text x="630" y="205" class="m" fill="#77758C" textLength="63"> notes </text>
<text x="693" y="205" class="m" fill="#77758C" textLength="135"> web-dashboard </text>
<text x="72" y="229" class="m" fill="#77758C" textLength="81">/newer:7D</text>
<text x="171" y="229" class="m" fill="#7D56F4" textLength="297">trashed 4 — tab to view / restore</text>
<rect x="76.5" y="248.5" width="567" height="264" rx="3" fill="none" stroke="#3B3852"/>
<rect x="652.5" y="248.5" width="468" height="264" rx="3" fill="none" stroke="#3B3852"/>
<rect x="81" y="240" width="252" height="16" fill="#100E19"/>
<text x="81" y="253" class="m" fill="#77758C" textLength="90"> sessions </text>
<text x="171" y="253" class="m p1" fill="#77758C" textLength="9">2</text>
<text x="171" y="253" class="m p2" fill="#77758C" textLength="9">3</text>
<text x="171" y="253" class="m p3" fill="#77758C" textLength="9">4</text>
<text x="180" y="253" class="m" fill="#77758C" textLength="54">/42 · </text>
<text x="234" y="253" class="m c1" fill="#77758C" textLength="9">1</text>
<text x="234" y="253" class="m c2" fill="#77758C" textLength="9">2</text>
<text x="234" y="253" class="m c3" fill="#77758C" textLength="9">3</text>
<text x="243" y="253" class="m" fill="#77758C" textLength="90"> selected </text>
<g class="bar"><rect x="81" y="284" width="549" height="24" fill="#7D56F4"/><text x="81" y="301" class="m" fill="#FAFAFA" textLength="9">›</text></g>
<text x="99" y="277" class="m" fill="#E4E2EE" textLength="27">[ ]</text>
<text x="135" y="277" class="m" fill="#E4E2EE" textLength="9">●</text>
<text x="153" y="277" class="m" fill="#E4E2EE" textLength="378">now ccsm           Redesign README artwork</text>
<text x="99" y="301" class="m" fill="#E4E2EE" textLength="27">[ ]</text>
<text x="153" y="301" class="m" fill="#E4E2EE" textLength="369"> 2h api-gateway    Fix token refresh race</text>
<text x="99" y="325" class="m" fill="#E4E2EE" textLength="27">[ ]</text>
<text x="153" y="325" class="m" fill="#E4E2EE" textLength="396"> 5h api-gateway    Add rate limit middleware</text>
<text x="108" y="325" class="m x2" fill="#E4E2EE" textLength="9">x</text>
<text x="99" y="349" class="m" fill="#E4E2EE" textLength="27">[ ]</text>
<text x="153" y="349" class="m" fill="#E4E2EE" textLength="423"> 1d web-dashboard  Dark mode toggle in settings</text>
<text x="108" y="349" class="m x3" fill="#E4E2EE" textLength="9">x</text>
<text x="99" y="373" class="m" fill="#E4E2EE" textLength="27">[ ]</text>
<text x="153" y="373" class="m" fill="#E4E2EE" textLength="414"> 1d infra          ★ Terraform state migration</text>
<text x="99" y="397" class="m" fill="#E4E2EE" textLength="27">[x]</text>
<text x="153" y="397" class="m" fill="#E4E2EE" textLength="378"> 2d notes          Summarise meeting notes</text>
<text x="99" y="421" class="m" fill="#7D56F4" textLength="27">[ ]</text>
<text x="153" y="421" class="m" fill="#7D56F4" textLength="342"> 3d ios-app        Crash on cold start</text>
<text x="99" y="445" class="m" fill="#E4E2EE" textLength="27">[ ]</text>
<text x="153" y="445" class="m" fill="#E4E2EE" textLength="369"> 4d web-dashboard  Chart tooltip overflow</text>
<text x="99" y="469" class="m" fill="#E4E2EE" textLength="27">[ ]</text>
<text x="153" y="469" class="m" fill="#E4E2EE" textLength="360"> 6d compiler       Constant folding pass</text>
<text x="99" y="493" class="m" fill="#E4E2EE" textLength="27">[ ]</text>
<text x="153" y="493" class="m" fill="#E4E2EE" textLength="333"> 6d dotfiles       Tidy shell aliases</text>
<line x1="634.5" y1="262" x2="634.5" y2="498" stroke="#2E2B40" stroke-width="2"/>
<rect x="631.5" y="262" width="6" height="58" rx="3" fill="#5A5670"/>
<g class="p1">
<rect x="657" y="240" width="360" height="16" fill="#100E19"/>
<text x="657" y="253" class="m" fill="#77758C" textLength="360"> 7f3a9c2e · ~/code/api-gateway · 1.2 MB </text>
<text x="657" y="277" class="m" fill="#EE6FF8" textLength="27" font-weight="700">you</text>
<text x="702" y="277" class="m" fill="#E4E2EE" textLength="378">Two requests refresh the token at once and</text>
<text x="657" y="301" class="m" fill="#E4E2EE" textLength="342">one gets a 401. Can you find the race?</text>
<text x="657" y="349" class="m" fill="#77758C" textLength="54">claude</text>
<text x="729" y="349" class="m" fill="#E4E2EE" textLength="387">Found it. refresh() reads the token, awaits</text>
<text x="657" y="373" class="m" fill="#E4E2EE" textLength="405">the network, then writes. A second caller can</text>
<text x="657" y="397" class="m" fill="#E4E2EE" textLength="423">start in between. I will guard it with a single</text>
<text x="657" y="421" class="m" fill="#E4E2EE" textLength="162">in-flight promise.</text>
<text x="657" y="469" class="m" fill="#EE6FF8" textLength="27" font-weight="700">you</text>
<text x="702" y="469" class="m" fill="#E4E2EE" textLength="198">Do it, and add a test.</text>
</g>
<g class="p2">
<rect x="657" y="240" width="378" height="16" fill="#100E19"/>
<text x="657" y="253" class="m" fill="#77758C" textLength="378"> b21d04aa · ~/code/api-gateway · 640.2 KB </text>
<text x="657" y="277" class="m" fill="#EE6FF8" textLength="27" font-weight="700">you</text>
<text x="702" y="277" class="m" fill="#E4E2EE" textLength="387">Add a rate limit: 100 requests a minute per</text>
<text x="657" y="301" class="m" fill="#E4E2EE" textLength="207">API key, 429 when over.</text>
<text x="657" y="349" class="m" fill="#77758C" textLength="54">claude</text>
<text x="729" y="349" class="m" fill="#E4E2EE" textLength="360">Added a token bucket middleware keyed by</text>
<text x="657" y="373" class="m" fill="#E4E2EE" textLength="378">API key, with a Retry-After header on 429.</text>
<text x="657" y="397" class="m" fill="#E4E2EE" textLength="252">Limits are read from config.</text>
<text x="657" y="445" class="m" fill="#EE6FF8" textLength="27" font-weight="700">you</text>
<text x="702" y="445" class="m" fill="#E4E2EE" textLength="342">Make the limit configurable per route.</text>
<text x="657" y="493" class="m" fill="#77758C" textLength="54">claude</text>
<text x="729" y="493" class="m" fill="#E4E2EE" textLength="360">Done. Routes override it in routes.toml.</text>
</g>
<g class="p3">
<rect x="657" y="240" width="378" height="16" fill="#100E19"/>
<text x="657" y="253" class="m" fill="#77758C" textLength="378"> 03c9e7f1 · ~/code/web-dashboard · 2.4 MB </text>
<text x="657" y="277" class="m" fill="#EE6FF8" textLength="27" font-weight="700">you</text>
<text x="702" y="277" class="m" fill="#E4E2EE" textLength="396">Add a dark mode toggle to the settings page.</text>
<text x="657" y="325" class="m" fill="#77758C" textLength="54">claude</text>
<text x="729" y="325" class="m" fill="#E4E2EE" textLength="369">Added the toggle. It stores the choice in</text>
<text x="657" y="349" class="m" fill="#E4E2EE" textLength="369">localStorage and follows the system theme</text>
<text x="657" y="373" class="m" fill="#E4E2EE" textLength="225">until the user picks one.</text>
<text x="657" y="421" class="m" fill="#EE6FF8" textLength="27" font-weight="700">you</text>
<text x="702" y="421" class="m" fill="#E4E2EE" textLength="378">The chart colours look washed out in dark.</text>
<text x="657" y="469" class="m" fill="#77758C" textLength="54">claude</text>
<text x="729" y="469" class="m" fill="#E4E2EE" textLength="351">Switched the charts to theme tokens, so</text>
<text x="657" y="493" class="m" fill="#E4E2EE" textLength="252">they follow the palette now.</text>
</g>
<text x="72" y="541" class="m" fill="#77758C" textLength="594">↑↓ move · ←→ folder · space select · a all · enter open · / filter</text>
<text x="72" y="565" class="m" fill="#77758C" textLength="675">d trash · c claim owner · y copy resume · t theme · ? all keys · esc quit ·</text>
<rect x="756" y="548" width="117" height="24" fill="#7D56F4"/>
