<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="title desc">
<title id="title">ccsm: Claude Code session manager</title>
<desc id="desc">Terminal window showing ccsm: folder tabs, a session list with a moving cursor and checkboxes, a transcript preview of the session under the cursor, and key hints ending in a trash counter.</desc>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px}
.word{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:34px;font-weight:800;letter-spacing:.5px}
.tag{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px}
.pill{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13px}
.bar,.p1,.p2,.p3,.c1,.c2,.c3,.x2,.x3{animation:12s step-end infinite}
.p2,.p3,.c2,.c3,.x2,.x3{opacity:0}
.bar{animation-name:bar}.p1{animation-name:p1}.p2{animation-name:p2}.p3{animation-name:p3}
.c1{animation-name:c1}.c2{animation-name:c2}.c3{animation-name:c3}.x2{animation-name:x2}.x3{animation-name:c3}
@keyframes bar{0%{transform:translateY(0)}25%{transform:translateY(24px)}50%{transform:translateY(48px)}75%,100%{transform:translateY(0)}}
@keyframes p1{0%{opacity:1}25%{opacity:0}75%,100%{opacity:1}}
@keyframes p2{0%{opacity:0}25%{opacity:1}50%,100%{opacity:0}}
@keyframes p3{0%{opacity:0}50%{opacity:1}75%,100%{opacity:0}}
@keyframes c1{0%{opacity:1}37.5%,100%{opacity:0}}
@keyframes c2{0%{opacity:0}37.5%{opacity:1}62.5%,100%{opacity:0}}
@keyframes c3{0%{opacity:0}62.5%,100%{opacity:1}}
@keyframes x2{0%{opacity:0}37.5%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D0A1A"/><stop offset=".55" stop-color="#15102A"/><stop offset="1" stop-color="#1C1236"/></linearGradient>
<linearGradient id="hedge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EE6FF8" stop-opacity=".55"/><stop offset=".5" stop-color="#7D56F4" stop-opacity=".25"/><stop offset="1" stop-color="#7D56F4" stop-opacity=".6"/></linearGradient>
<radialGradient id="hglowA" cx=".85" cy="0" r=".6"><stop offset="0" stop-color="#EE6FF8" stop-opacity=".22"/><stop offset="1" stop-color="#EE6FF8" stop-opacity="0"/></radialGradient>
<radialGradient id="hglowB" cx=".05" cy="1" r=".7"><stop offset="0" stop-color="#7D56F4" stop-opacity=".30"/><stop offset="1" stop-color="#7D56F4" stop-opacity="0"/></radialGradient>
</defs>
<rect x="1" y="1" width="1198" height="626" rx="24" fill="url(#hbg)"/>
<rect x="1" y="1" width="1198" height="626" rx="24" fill="url(#hglowA)"/>
<rect x="1" y="1" width="1198" height="626" rx="24" fill="url(#hglowB)"/>
<rect x="1" y="1" width="1198" height="626" rx="24" fill="none" stroke="url(#hedge)" stroke-width="1.5"/>
<defs><linearGradient id="logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EE6FF8"/><stop offset="1" stop-color="#7D56F4"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".5"/></filter></defs>
<rect x="48" y="30" width="56" height="56" rx="14" fill="url(#logo)"/>
<path d="M65 46 l13 12 -13 12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="82" y="66" width="12" height="5" rx="2.5" fill="#fff"/>
<text x="122" y="62" class="word" fill="#fff">ccsm</text>
<text x="123" y="86" class="tag" fill="#B9B4D0">Browse. Filter. Trash. Restore.</text>
<rect x="938" y="43" width="214" height="30" rx="15" fill="#7D56F4" fill-opacity=".2" stroke="#7D56F4" stroke-opacity=".7"/><text x="1045.0" y="63" class="pill" fill="#E4E2EE" text-anchor="middle">windows · macos · linux</text>
<rect x="744" y="43" width="182" height="30" rx="15" fill="#7D56F4" fill-opacity=".2" stroke="#7D56F4" stroke-opacity=".7"/><text x="835.0" y="63" class="pill" fill="#E4E2EE" text-anchor="middle">◆ recoverable trash</text>
