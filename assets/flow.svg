<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="296" viewBox="0 0 1200 296" role="img" aria-labelledby="title desc">
<title id="title">How the ccsm trash works</title>
<desc id="desc">Sessions in ~/.claude/projects move to ~/.claude/.session-cleaner-trash with the d key, come back to their original path with r, and are only deleted for good with x in the trash view. Live sessions are locked.</desc>
<style>
.cap{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:1.6px}
.h{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:18px;font-weight:700}
.p{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12.5px}
.s{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13.5px}
.key{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13px;font-weight:700}
.dot{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px}
.dash{animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D0A1A"/><stop offset=".55" stop-color="#15102A"/><stop offset="1" stop-color="#1C1236"/></linearGradient>
<linearGradient id="fedge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EE6FF8" stop-opacity=".55"/><stop offset=".5" stop-color="#7D56F4" stop-opacity=".25"/><stop offset="1" stop-color="#7D56F4" stop-opacity=".6"/></linearGradient>
<radialGradient id="fglowA" cx=".85" cy="0" r=".6"><stop offset="0" stop-color="#EE6FF8" stop-opacity=".22"/><stop offset="1" stop-color="#EE6FF8" stop-opacity="0"/></radialGradient>
<radialGradient id="fglowB" cx=".05" cy="1" r=".7"><stop offset="0" stop-color="#7D56F4" stop-opacity=".30"/><stop offset="1" stop-color="#7D56F4" stop-opacity="0"/></radialGradient>
</defs>
<rect x="1" y="1" width="1198" height="294" rx="24" fill="url(#fbg)"/>
<rect x="1" y="1" width="1198" height="294" rx="24" fill="url(#fglowA)"/>
<rect x="1" y="1" width="1198" height="294" rx="24" fill="url(#fglowB)"/>
<rect x="1" y="1" width="1198" height="294" rx="24" fill="none" stroke="url(#fedge)" stroke-width="1.5"/>
<defs><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EE6FF8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3DD68C"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF5555"/></marker></defs>
<text x="48" y="46" class="cap" fill="#B9B4D0">TRASH IS A MOVE, NOT A DELETE</text>
<rect x="48" y="70" width="264" height="112" rx="14" fill="#100E19" stroke="#7D56F4" stroke-opacity=".75"/><text x="180.0" y="104" class="h" fill="#fff" text-anchor="middle">Sessions</text><text x="180.0" y="132" class="p" fill="#C4B5FD" text-anchor="middle">~/.claude/projects</text><text x="180.0" y="158" class="s" fill="#B9B4D0" text-anchor="middle">transcripts and their artifacts</text>
<rect x="468" y="70" width="264" height="112" rx="14" fill="#100E19" stroke="#EE6FF8" stroke-opacity=".75"/><text x="600.0" y="104" class="h" fill="#fff" text-anchor="middle">Trash</text><text x="600.0" y="132" class="p" fill="#F5B4FA" text-anchor="middle">~/.claude/.session-cleaner-trash</text><text x="600.0" y="158" class="s" fill="#B9B4D0" text-anchor="middle">moved here, nothing deleted</text>
<rect x="888" y="70" width="264" height="112" rx="14" fill="#100E19" stroke="#FF5555" stroke-opacity=".75"/><text x="1020.0" y="104" class="h" fill="#fff" text-anchor="middle">Deleted forever</text><text x="1020.0" y="132" class="p" fill="#FF9C9C" text-anchor="middle">x in the trash view</text><text x="1020.0" y="158" class="s" fill="#B9B4D0" text-anchor="middle">cannot be undone</text>
<line x1="324" y1="110" x2="456" y2="110" stroke="#EE6FF8" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round" marker-end="url(#ap)" class="dash"/><rect x="323.25" y="81" width="22" height="22" rx="6" fill="#231D3D" stroke="#EE6FF8"/><text x="334.25" y="96" class="key" fill="#fff" text-anchor="middle">d</text><text x="353.25" y="96" class="s" fill="#E4E2EE">trash · confirm</text>
<line x1="456" y1="146" x2="324" y2="146" stroke="#3DD68C" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round" marker-end="url(#ag)" class="dash"/><rect x="350.85" y="157" width="22" height="22" rx="6" fill="#231D3D" stroke="#3DD68C"/><text x="361.85" y="172" class="key" fill="#fff" text-anchor="middle">r</text><text x="380.85" y="172" class="s" fill="#E4E2EE">restore</text>
<line x1="744" y1="126" x2="876" y2="126" stroke="#FF5555" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round" marker-end="url(#ar)" class="dash"/><rect x="739.8" y="97" width="22" height="22" rx="6" fill="#231D3D" stroke="#FF5555"/><text x="750.8" y="112" class="key" fill="#fff" text-anchor="middle">x</text><text x="769.8" y="112" class="s" fill="#E4E2EE">delete · confirm</text>
<rect x="48" y="212" width="1104" height="52" rx="12" fill="#100E19" stroke="#2E2947"/>
<text x="72" y="244" class="dot" fill="#3DD68C">●</text>
<text x="94" y="243" class="s" fill="#E4E2EE"><tspan font-weight="700" fill="#fff">Live sessions are locked.</tspan> Owned by a running Claude Code process, or written in the last 10 minutes: cannot be trashed or re-owned.</text>
</svg>
