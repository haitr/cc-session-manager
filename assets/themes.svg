<text x="73.0" y="101" class="t" fill="#FF87D7" textLength="122.4" font-weight="700">ccsm  42 sessions</text>
<rect x="73.0" y="106" width="50.4" height="19" fill="#AF87FF"/>
<text x="73.0" y="120" class="t" fill="#262626" textLength="50.4"> [all] </text>
