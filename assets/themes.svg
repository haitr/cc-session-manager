<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="262" viewBox="0 0 1200 262" role="img" aria-labelledby="title desc">
<title id="title">ccsm colour themes</title>
<desc id="desc">Five small previews of the ccsm list, one per built-in theme: dark, light, charm, ocean and sunset. A highlight ring moves from one to the next, as the t key does.</desc>
<style>
.t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px}
.key{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px;font-weight:700}
.cap{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px}
.name{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:14px}
.ring{opacity:0;animation:ring 10s step-end infinite}
@keyframes ring{0%{opacity:1}20%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D0A1A"/><stop offset=".55" stop-color="#15102A"/><stop offset="1" stop-color="#1C1236"/></linearGradient>
<linearGradient id="tedge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EE6FF8" stop-opacity=".55"/><stop offset=".5" stop-color="#7D56F4" stop-opacity=".25"/><stop offset="1" stop-color="#7D56F4" stop-opacity=".6"/></linearGradient>
<radialGradient id="tglowA" cx=".85" cy="0" r=".6"><stop offset="0" stop-color="#EE6FF8" stop-opacity=".22"/><stop offset="1" stop-color="#EE6FF8" stop-opacity="0"/></radialGradient>
<radialGradient id="tglowB" cx=".05" cy="1" r=".7"><stop offset="0" stop-color="#7D56F4" stop-opacity=".30"/><stop offset="1" stop-color="#7D56F4" stop-opacity="0"/></radialGradient>
</defs>
<rect x="1" y="1" width="1198" height="260" rx="24" fill="url(#tbg)"/>
<rect x="1" y="1" width="1198" height="260" rx="24" fill="url(#tglowA)"/>
<rect x="1" y="1" width="1198" height="260" rx="24" fill="url(#tglowB)"/>
<rect x="1" y="1" width="1198" height="260" rx="24" fill="none" stroke="url(#tedge)" stroke-width="1.5"/>
<rect x="60" y="28" width="28" height="28" rx="7" fill="#231D3D" stroke="#7D56F4"/>
